apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
  labels:
    app: fastapi-ventas
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi-ventas
  template:
    metadata:
      labels:
        app: fastapi-ventas
    spec:
      containers:
      - name: fastapi-container
        image: app-monitoreo:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi-ventas
  # ⬇️ ESTAS ANOTACIONES LE DICEN A PROMETHEUS: "¡MÍRAME, RECOLECTA MIS DATOS!"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: fastapi-ventas
  type: ClusterIP
